<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Favicon and App Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    
    <!-- Primary Meta Tags -->
    <title>Sympalyze - Healthcare meets AI</title>
    <meta name="title" content="Sympalyze - Healthcare meets AI" />
    <meta name="description" content="Get accurate, evidence-based answers to your medical questions with AI-powered healthcare search. Upload images, select symptoms, and receive information from trusted medical sources." />
    <meta name="theme-color" content="#3b82f6" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sympalyze.ai/" />
    <meta property="og:title" content="Sympalyze - Healthcare meets AI" />
    <meta property="og:description" content="AI-powered healthcare search with symptom analysis, image processing, and trusted medical sources." />
    <meta property="og:image" content="/og-image.png" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://sympalyze.ai/" />
    <meta property="twitter:title" content="Sympalyze - Healthcare meets AI" />
    <meta property="twitter:description" content="AI-powered healthcare search with symptom analysis, image processing, and trusted medical sources." />
    <meta property="twitter:image" content="/og-image.png" />
    
    <!-- Manifest for PWA -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Additional Meta -->
    <meta name="keywords" content="healthcare, medical, AI, symptom checker, medical information, health search" />
    <meta name="author" content="Sympalyze" />
    <meta name="application-name" content="Sympalyze" />
    
    <!-- Medical Disclaimer in Metadata -->
    <meta name="disclaimer" content="For informational purposes only. Not a substitute for professional medical advice." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Medical Disclaimer for Screen Readers -->
    <div aria-hidden="false" class="sr-only">
      Sympalyze provides information for educational purposes only and is not a substitute for professional medical advice, diagnosis, or treatment. Always consult a qualified healthcare provider with any questions regarding a medical condition.
    </div>
  </body>
</html>
